[project]
name = "waku-agent-harness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=3.5.0",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
waku = "waku_agent_harness.cli:main"
waku-agent-harness = "waku_agent_harness.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

# Lint/format settings, used by `ruff` and the python-lint skill (.agents/skills/python-lint).
[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E/F: pycodestyle errors + pyflakes (real bugs), I: import order,
# UP: modern Python syntax, B: bugbear (likely bugs and bad patterns).
select = ["E", "F", "I", "UP", "B"]
